name: MCA CI CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build-test-deploy:

    runs-on: self-hosted

    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/mca-ci-cd-app

    steps:

      # STEP 1: Download source code

      - name: Checkout Code
        uses: actions/checkout@v4

      # STEP 2: Setup Python

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # STEP 3: Install dependencies

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # STEP 4: Execute application tests

      - name: Run Python Tests
        run: |
          python -m unittest -v test_app.py

      # STEP 5: Login to Docker Hub

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # STEP 6: Setup Docker Buildx

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # STEP 7: Build and Push Docker Image

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      # STEP 8: Deploy application to Kubernetes

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yaml

          kubectl set image deployment/mca-ci-cd-app \
            app=${{ env.IMAGE_NAME }}:${{ github.sha }}

          kubectl rollout status deployment/mca-ci-cd-app \
            --timeout=180s

      # STEP 9: Verify deployment

      - name: Verify Kubernetes Deployment
        run: |
          kubectl get deployments
          kubectl get pods
          kubectl get services
